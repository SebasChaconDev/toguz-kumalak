name: toguz-infra-spike
services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    ports:
      - "127.0.0.1:15435:5432"
    environment:
      POSTGRES_USER: spike_admin
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD:?generate local credentials first}
      IDENTITY_PASSWORD: ${IDENTITY_PASSWORD:?generate local credentials first}
      GAME_PASSWORD: ${GAME_PASSWORD:?generate local credentials first}
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - spike_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
    cpus: 1.0
volumes:
  spike_pg:
